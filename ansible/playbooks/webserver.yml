---
- name: Configurer un serveur WEB
  hosts: all
  become: true

  vars:
    packages:
      - nginx
      - curl
      - vim

  tasks:
    - name: Installer les paquets
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true

    - name: Démarrer et activer nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Déployer la page d'accueil
      ansible.builtin.template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"