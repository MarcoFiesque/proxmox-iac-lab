---
- name: Bootstrap des serveurs linux
  hosts: all
  become: true

  tasks:
    - name: Installer QEMU Guest Agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true

    - name: Démarrer et activer QEMU Guest Agent
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true